name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v1.0.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  GAME_NAME: zombrise

permissions:
  contents: write

jobs:
  # PHASE 1: Build binaries and Packages
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: zombrise_client
            # Optimization: Use fast linker for Linux
            rustflags: "-C link-arg=-fuse-ld=lld"

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: zombrise_client.exe
            rustflags: "" # Default MSVC linker is fine

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: zombrise_client
            rustflags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache apt packages
        if: matrix.platform.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        # Added 'lld' for faster linking
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config pigz lld

      # - name: Install cargo-deb (Linux only)
      #   if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
      #   # We install this HERE so we can use the binary we are about to build
      #   run: cargo install cargo-deb

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
          cache-all-crates: true
          # Saving on release tags can be useful if deps change between main and release
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build binary
        env:
          # Apply linker flags from matrix
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: cargo build --release --bin zombrise_client --target ${{ matrix.platform.target }}

      # --- ARCHIVE CREATION (Existing Logic) ---
      - name: Prepare Archive
        shell: bash
        run: |
          STAGING="zombrise-${{ matrix.platform.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}" "$STAGING/"

          if [ -d "assets" ]; then
            cp -r assets "$STAGING/"
          elif [ -d "client/assets" ]; then
            mkdir -p "$STAGING/assets"
            cp -r client/assets/* "$STAGING/assets/"
          else
            echo "::warning::Assets not found!"
          fi

          cat > "$STAGING/README.txt" <<EOF
          Zombrise
          To run the game: ./${{ matrix.platform.binary_name }}
          EOF

          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            7z a -mmt=on "$STAGING.zip" "$STAGING"
            echo "ASSET=$STAGING.zip" >> $GITHUB_ENV
          else
            if command -v pigz &> /dev/null; then
              tar -I pigz -cf "$STAGING.tar.gz" "$STAGING"
            else
              tar -czf "$STAGING.tar.gz" "$STAGING"
            fi
            echo "ASSET=$STAGING.tar.gz" >> $GITHUB_ENV
          fi

      # --- DEB PACKAGE CREATION (Moved here) ---
      # - name: Create .deb package (Linux only)
      #   if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
      #   run: |
      #     # Cargo.toml expects the binary at target/release/zombrise_client
      #     # But we built with --target, so it's in target/${{ matrix.platform.target }}/release/
      #     mkdir -p target/release
      #     cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}" "target/release/${{ matrix.platform.binary_name }}"
      #
      #     # Run cargo deb from workspace root so paths in Cargo.toml resolve correctly
      #     cargo deb --no-build --target ${{ matrix.platform.target }} -p zombrise_client --output zombrise.deb
      #
      #     echo "DEB_ASSET=zombrise.deb" >> $GITHUB_ENV

      # --- UPLOAD ---
      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombrise-${{ matrix.platform.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # - name: Upload Deb Artifact
      #   if: matrix.platform.target == 'x86_64-unknown-linux-gnu'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: zombrise-deb
      #     path: zombrise.deb
      #     if-no-files-found: error

  # PHASE 2: Create Release
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build] # Only depends on the one job now
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Zombrise ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false
          files: artifacts/*
