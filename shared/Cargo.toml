[package]
name = "zombrise_shared"
version = "0.1.0"
edition = "2021"

[dependencies]
# Minimal features for both client and server
bevy = { version = "0.17", default-features = false, features = [
    "serialize",
    "bevy_state",
] }
lightyear = { version = "0.25", default-features = false, features = [
    "interpolation",
    "prediction",
    "replication",
    "input_native",
] }
# bevy_replicon = "0.36"
# bevy_replicon_renet2 = "0.11"
avian3d = { version = "0.4", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.9.2"

# Optional: only needed for client
bevy_input = { version = "0.17", optional = true }
libloading = "0.9.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
suduxu-rs = { path = "../suduxu-rs" }


[features]
default = []
# Client feature includes all graphics dependencies
client = [
    "bevy/bevy_asset",
    "bevy/bevy_scene",
    "bevy/bevy_gltf",
    "bevy/animation",
    "bevy/bevy_pbr",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy_input",
    "lightyear/client",
]
